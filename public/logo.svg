<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1e38" />
      <stop offset="50%" stop-color="#081528" />
      <stop offset="100%" stop-color="#040a14" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Candlestick Center Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Tile with Rounded Corners -->
  <rect x="16" y="16" width="368" height="368" rx="80" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Inner Ambient Glow Layer -->
  <rect x="24" y="24" width="352" height="352" rx="72" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Graphic Mark Group (Candlestick & Momentum Breakout) -->
  <g filter="url(#cyanGlow)">
    <!-- Left Candlestick (Signal Bar) -->
    <line x1="100" y1="160" x2="100" y2="280" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" opacity="0.65" />
    <rect x="84" y="190" width="32" height="55" rx="8" fill="#22d3ee" opacity="0.8" />

    <!-- Center Primary Candlestick (Surge Bar) -->
    <line x1="200" y1="80" x2="200" y2="320" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" />
    <rect x="176" y="125" width="48" height="125" rx="12" fill="url(#cyanBlueGrad)" stroke="#22d3ee" stroke-width="4" />

    <!-- Right Candlestick (Breakout Bar) -->
    <line x1="300" y1="70" x2="300" y2="250" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <rect x="284" y="95" width="32" height="75" rx="8" fill="#38bdf8" />

    <!-- Trend Line / Algorithmic Execution Vector -->
    <path d="M100 230 L200 150 L300 105" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Signal Pulses on Nodes -->
    <circle cx="100" cy="230" r="8" fill="#ffffff" />
    <circle cx="200" cy="150" r="9" fill="#ffffff" />
    <circle cx="300" cy="105" r="9" fill="#38bdf8" />
  </g>
</svg>
