<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140" width="100%" height="100%">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1e38" />
      <stop offset="50%" stop-color="#081528" />
      <stop offset="100%" stop-color="#040a14" />
    </linearGradient>

    <linearGradient id="fullBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="fullBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="fullCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 15)">
    <!-- Badge Box -->
    <rect x="0" y="0" width="110" height="110" rx="26" fill="url(#fullBgGrad)" stroke="url(#fullBorderGrad)" stroke-width="2.5"/>
    <rect x="3" y="3" width="104" height="104" rx="23" fill="none" stroke="#22d3ee" stroke-opacity="0.1" stroke-width="1.5"/>

    <!-- Candlestick Graphic -->
    <g filter="url(#fullCyanGlow)">
      <!-- Left Bar -->
      <line x1="28" y1="46" x2="28" y2="78" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
      <rect x="23" y="54" width="10" height="16" rx="2.5" fill="#22d3ee" opacity="0.8" />

      <!-- Center Bar -->
      <line x1="55" y1="24" x2="55" y2="88" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" />
      <rect x="47.5" y="36" width="15" height="36" rx="3.5" fill="url(#fullBarGrad)" stroke="#22d3ee" stroke-width="1.5" />

      <!-- Right Bar -->
      <line x1="82" y1="20" x2="82" y2="68" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
      <rect x="77" y="27" width="10" height="21" rx="2.5" fill="#38bdf8" />

      <!-- Vector Line -->
      <path d="M28 65 L55 42 L82 29" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(145, 82)">
    <text font-family="system-ui, -apple-system, 'Outfit', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Algo Trders<tspan fill="#22d3ee">.site</tspan>
    </text>
    <text y="28" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="0.12em">
      ALGORITHMIC TRADING SYSTEMS
    </text>
  </g>
</svg>
