name: Validate licensed website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps
      - run: python -m pip install 'PyJWT[crypto]>=2.10,<3' 'cryptography>=44' requests
      - run: npm run lint
      - run: npm test
        env:
          # The real client lives in a private repository. Its own workflow runs
          # the full suite against the pinned public website submodule.
          QBOT_TEST_SKIP_CLIENT_INTEROP: '1'
      - run: npm run build
      - run: node tests/production-start.mjs

# Deploy the built Node service through Render using render.yaml.
# Uploading this source to a public FTP directory cannot run the licensing API.
