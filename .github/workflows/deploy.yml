name: Deploy Website to InfinityFree

on:
  push:
    branches:
      - main # Change to 'master' if your default branch uses that name

jobs:
  web-deploy:
    name: Deploying via FTP
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Upload files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/ # Directs files straight to your public directory
